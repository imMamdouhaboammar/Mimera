<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mimera Navbar Fixture</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, sans-serif; background: #f7f5ef; color: #161616; }
      header { position: sticky; top: 0; background: rgba(247, 245, 239, 0.96); border-bottom: 1px solid #d9d5ca; }
      .navbar { min-height: 72px; max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; }
      .brand { font-weight: 700; letter-spacing: -0.03em; }
      nav { display: flex; gap: 24px; }
      nav a { color: inherit; text-decoration: none; }
      .menu-toggle { display: none; width: 44px; height: 44px; border: 1px solid #aaa; background: transparent; border-radius: 12px; }
      main { min-height: 1400px; padding: 80px 24px; }
      h1 { max-width: 780px; margin: 0 auto; font-size: clamp(48px, 8vw, 104px); line-height: .92; text-align: center; }
      @media (max-width: 700px) {
        .navbar { min-height: 60px; padding: 0 16px; }
        nav { display: none; }
        .menu-toggle { display: inline-grid; place-items: center; }
        h1 { font-size: 52px; }
      }
    </style>
  </head>
  <body>
    <header data-component="navbar">
      <div class="navbar">
        <a class="brand" href="/">Mimera</a>
        <nav id="main-nav" aria-label="Primary navigation">
          <a href="#work">Work</a>
          <a href="#method">Method</a>
          <a href="#contact">Contact</a>
        </nav>
        <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
      </div>
    </header>
    <main>
      <h1>Reference direction, rebuilt with evidence.</h1>
    </main>
  </body>
</html>
